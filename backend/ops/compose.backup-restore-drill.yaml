services:
  source-db:
    image: postgres:17.9-alpine3.23@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    volumes:
      - source_postgres:/var/lib/postgresql/data
    networks:
      - source

  source-nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.40.0@sha256:92fb184e3271be12fd4d239766afb285322a50aaf769a59433445d59624c78cd
    depends_on:
      source-db:
        condition: service_healthy
    environment:
      NAKAMA_DB_ADDRESS: "${POSTGRES_USER}:${POSTGRES_PASSWORD}@source-db:5432/${POSTGRES_DB}"
      NAKAMA_SERVER_KEY: "${NAKAMA_SERVER_KEY:?set NAKAMA_SERVER_KEY}"
      NAKAMA_SESSION_ENCRYPTION_KEY: "${NAKAMA_SESSION_ENCRYPTION_KEY:?set NAKAMA_SESSION_ENCRYPTION_KEY}"
      NAKAMA_REFRESH_ENCRYPTION_KEY: "${NAKAMA_REFRESH_ENCRYPTION_KEY:?set NAKAMA_REFRESH_ENCRYPTION_KEY}"
      NAKAMA_RUNTIME_HTTP_KEY: "${NAKAMA_RUNTIME_HTTP_KEY:?set NAKAMA_RUNTIME_HTTP_KEY}"
      NAKAMA_CONSOLE_USERNAME: "${NAKAMA_CONSOLE_USERNAME:?set NAKAMA_CONSOLE_USERNAME}"
      NAKAMA_CONSOLE_PASSWORD: "${NAKAMA_CONSOLE_PASSWORD:?set NAKAMA_CONSOLE_PASSWORD}"
      NAKAMA_CONSOLE_SIGNING_KEY: "${NAKAMA_CONSOLE_SIGNING_KEY:?set NAKAMA_CONSOLE_SIGNING_KEY}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /nakama/nakama migrate up --database.address "$$NAKAMA_DB_ADDRESS"
        exec /nakama/nakama --config /nakama/data/config/nakama.yml \
          --database.address "$$NAKAMA_DB_ADDRESS" \
          --socket.server_key "$$NAKAMA_SERVER_KEY" \
          --session.encryption_key "$$NAKAMA_SESSION_ENCRYPTION_KEY" \
          --session.refresh_encryption_key "$$NAKAMA_REFRESH_ENCRYPTION_KEY" \
          --runtime.http_key "$$NAKAMA_RUNTIME_HTTP_KEY" \
          --console.username "$$NAKAMA_CONSOLE_USERNAME" \
          --console.password "$$NAKAMA_CONSOLE_PASSWORD" \
          --console.signing_key "$$NAKAMA_CONSOLE_SIGNING_KEY"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 5s
    ports:
      - "127.0.0.1:${SOURCE_NAKAMA_API_PORT:?set SOURCE_NAKAMA_API_PORT}:7350"
    volumes:
      - ../config:/nakama/data/config:ro
      - ../modules:/nakama/data/modules:ro
    networks:
      - source

  restore-db:
    image: postgres:17.9-alpine3.23@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    volumes:
      - restore_postgres:/var/lib/postgresql/data
    networks:
      - restore

  restore-nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.40.0@sha256:92fb184e3271be12fd4d239766afb285322a50aaf769a59433445d59624c78cd
    depends_on:
      restore-db:
        condition: service_healthy
    environment:
      NAKAMA_DB_ADDRESS: "${POSTGRES_USER}:${POSTGRES_PASSWORD}@restore-db:5432/${POSTGRES_DB}"
      NAKAMA_SERVER_KEY: "${NAKAMA_SERVER_KEY:?set NAKAMA_SERVER_KEY}"
      NAKAMA_SESSION_ENCRYPTION_KEY: "${NAKAMA_SESSION_ENCRYPTION_KEY:?set NAKAMA_SESSION_ENCRYPTION_KEY}"
      NAKAMA_REFRESH_ENCRYPTION_KEY: "${NAKAMA_REFRESH_ENCRYPTION_KEY:?set NAKAMA_REFRESH_ENCRYPTION_KEY}"
      NAKAMA_RUNTIME_HTTP_KEY: "${NAKAMA_RUNTIME_HTTP_KEY:?set NAKAMA_RUNTIME_HTTP_KEY}"
      NAKAMA_CONSOLE_USERNAME: "${NAKAMA_CONSOLE_USERNAME:?set NAKAMA_CONSOLE_USERNAME}"
      NAKAMA_CONSOLE_PASSWORD: "${NAKAMA_CONSOLE_PASSWORD:?set NAKAMA_CONSOLE_PASSWORD}"
      NAKAMA_CONSOLE_SIGNING_KEY: "${NAKAMA_CONSOLE_SIGNING_KEY:?set NAKAMA_CONSOLE_SIGNING_KEY}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /nakama/nakama migrate up --database.address "$$NAKAMA_DB_ADDRESS"
        exec /nakama/nakama --config /nakama/data/config/nakama.yml \
          --database.address "$$NAKAMA_DB_ADDRESS" \
          --socket.server_key "$$NAKAMA_SERVER_KEY" \
          --session.encryption_key "$$NAKAMA_SESSION_ENCRYPTION_KEY" \
          --session.refresh_encryption_key "$$NAKAMA_REFRESH_ENCRYPTION_KEY" \
          --runtime.http_key "$$NAKAMA_RUNTIME_HTTP_KEY" \
          --console.username "$$NAKAMA_CONSOLE_USERNAME" \
          --console.password "$$NAKAMA_CONSOLE_PASSWORD" \
          --console.signing_key "$$NAKAMA_CONSOLE_SIGNING_KEY"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 5s
    ports:
      - "127.0.0.1:${RESTORE_NAKAMA_API_PORT:?set RESTORE_NAKAMA_API_PORT}:7350"
    volumes:
      - ../config:/nakama/data/config:ro
      - ../modules:/nakama/data/modules:ro
    networks:
      - restore

volumes:
  source_postgres:
  restore_postgres:

networks:
  source:
    driver: bridge
  restore:
    driver: bridge
