name: raceglyph-production

services:
  postgres:
    image: postgres:17.9-alpine3.23@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in backend/production/.env}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in backend/production/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/production/.env}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.40.0@sha256:92fb184e3271be12fd4d239766afb285322a50aaf769a59433445d59624c78cd
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NAKAMA_DB_ADDRESS: "${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      NAKAMA_SERVER_KEY: "${NAKAMA_SERVER_KEY:?set NAKAMA_SERVER_KEY in backend/production/.env}"
      NAKAMA_SESSION_ENCRYPTION_KEY: "${NAKAMA_SESSION_ENCRYPTION_KEY:?set NAKAMA_SESSION_ENCRYPTION_KEY in backend/production/.env}"
      NAKAMA_REFRESH_ENCRYPTION_KEY: "${NAKAMA_REFRESH_ENCRYPTION_KEY:?set NAKAMA_REFRESH_ENCRYPTION_KEY in backend/production/.env}"
      NAKAMA_RUNTIME_HTTP_KEY: "${NAKAMA_RUNTIME_HTTP_KEY:?set NAKAMA_RUNTIME_HTTP_KEY in backend/production/.env}"
      NAKAMA_CONSOLE_USERNAME: "${NAKAMA_CONSOLE_USERNAME:?set NAKAMA_CONSOLE_USERNAME in backend/production/.env}"
      NAKAMA_CONSOLE_PASSWORD: "${NAKAMA_CONSOLE_PASSWORD:?set NAKAMA_CONSOLE_PASSWORD in backend/production/.env}"
      NAKAMA_CONSOLE_SIGNING_KEY: "${NAKAMA_CONSOLE_SIGNING_KEY:?set NAKAMA_CONSOLE_SIGNING_KEY in backend/production/.env}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /nakama/nakama migrate up --database.address "$$NAKAMA_DB_ADDRESS"
        exec /nakama/nakama --config /nakama/data/config/nakama.yml \
          --database.address "$$NAKAMA_DB_ADDRESS" \
          --socket.server_key "$$NAKAMA_SERVER_KEY" \
          --session.encryption_key "$$NAKAMA_SESSION_ENCRYPTION_KEY" \
          --session.refresh_encryption_key "$$NAKAMA_REFRESH_ENCRYPTION_KEY" \
          --runtime.http_key "$$NAKAMA_RUNTIME_HTTP_KEY" \
          --console.username "$$NAKAMA_CONSOLE_USERNAME" \
          --console.password "$$NAKAMA_CONSOLE_PASSWORD" \
          --console.signing_key "$$NAKAMA_CONSOLE_SIGNING_KEY"
    expose:
      - "7350"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - ./nakama.yml:/nakama/data/config/nakama.yml:ro
      - ../modules:/nakama/data/modules:ro
    networks:
      - backend

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      nakama:
        condition: service_healthy
    environment:
      RACEGLYPH_DOMAIN: "${RACEGLYPH_DOMAIN:?set RACEGLYPH_DOMAIN in backend/production/.env}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL in backend/production/.env}"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
