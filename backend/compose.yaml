name: raceglyph-local

services:
  postgres:
    image: postgres:17.9-alpine3.23@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in backend/.env}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in backend/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - raceglyph_postgres:/var/lib/postgresql/data
    networks:
      - backend

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.40.0@sha256:92fb184e3271be12fd4d239766afb285322a50aaf769a59433445d59624c78cd
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NAKAMA_DB_ADDRESS: "${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      NAKAMA_SERVER_KEY: "${NAKAMA_SERVER_KEY:?set NAKAMA_SERVER_KEY in backend/.env}"
      NAKAMA_SESSION_ENCRYPTION_KEY: "${NAKAMA_SESSION_ENCRYPTION_KEY:?set NAKAMA_SESSION_ENCRYPTION_KEY in backend/.env}"
      NAKAMA_REFRESH_ENCRYPTION_KEY: "${NAKAMA_REFRESH_ENCRYPTION_KEY:?set NAKAMA_REFRESH_ENCRYPTION_KEY in backend/.env}"
      NAKAMA_RUNTIME_HTTP_KEY: "${NAKAMA_RUNTIME_HTTP_KEY:?set NAKAMA_RUNTIME_HTTP_KEY in backend/.env}"
      NAKAMA_CONSOLE_USERNAME: "${NAKAMA_CONSOLE_USERNAME:?set NAKAMA_CONSOLE_USERNAME in backend/.env}"
      NAKAMA_CONSOLE_PASSWORD: "${NAKAMA_CONSOLE_PASSWORD:?set NAKAMA_CONSOLE_PASSWORD in backend/.env}"
      NAKAMA_CONSOLE_SIGNING_KEY: "${NAKAMA_CONSOLE_SIGNING_KEY:?set NAKAMA_CONSOLE_SIGNING_KEY in backend/.env}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /nakama/nakama migrate up --database.address "$$NAKAMA_DB_ADDRESS"
        exec /nakama/nakama --config /nakama/data/config/nakama.yml \
          --database.address "$$NAKAMA_DB_ADDRESS" \
          --socket.server_key "$$NAKAMA_SERVER_KEY" \
          --session.encryption_key "$$NAKAMA_SESSION_ENCRYPTION_KEY" \
          --session.refresh_encryption_key "$$NAKAMA_REFRESH_ENCRYPTION_KEY" \
          --runtime.http_key "$$NAKAMA_RUNTIME_HTTP_KEY" \
          --console.username "$$NAKAMA_CONSOLE_USERNAME" \
          --console.password "$$NAKAMA_CONSOLE_PASSWORD" \
          --console.signing_key "$$NAKAMA_CONSOLE_SIGNING_KEY"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:${NAKAMA_API_PORT:-7350}:7350"
      - "127.0.0.1:${NAKAMA_CONSOLE_PORT:-7351}:7351"
    volumes:
      - ./config:/nakama/data/config:ro
      - ./modules:/nakama/data/modules:ro
    networks:
      - backend

volumes:
  raceglyph_postgres:

networks:
  backend:
    # PostgreSQL has no host port; Nakama alone is loopback-published above.
    # A non-internal bridge is required for Docker/Colima port forwarding.
    driver: bridge
